<!doctype html>
<!-- LifeLog clean build v4 ASCII-safe -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LifeLog</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#0d1321;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:22px 16px 70px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.head h1{font-size:34px;margin:0;letter-spacing:-1px}.head p{margin:4px 0 0;color:#9aa0ad}.round{border:0;background:#f3f4f6;border-radius:50%;width:48px;height:48px;font-size:26px}.goalBox{background:#f4faf7;border:1px solid #e2f0e8;border-radius:22px;padding:16px 18px;margin-bottom:34px}.goalTitle{font-weight:800;color:#128456;font-size:18px;margin-bottom:8px}.goal{padding:13px 0;border-bottom:1px solid #dfe9e3;font-size:17px;display:flex;gap:10px;align-items:center}.goal:last-child{border-bottom:0}.check{width:24px;height:24px;border:2px solid #a7ada9;border-radius:7px;background:#fff}.calHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month{font-size:42px;font-weight:900;letter-spacing:-2px}.calBtns{display:flex;gap:10px}.calBtn{border:0;background:#f3f4f6;border-radius:50%;width:48px;height:48px;font-size:22px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;font-weight:700;padding:12px 0;border-bottom:1px solid #e7e8eb}.week div:first-child{color:#e53935}.week div:last-child{color:#1565d8}.grid{border-left:1px solid #e7e8eb;border-top:1px solid #e7e8eb;border-radius:18px;overflow:hidden}.day{min-height:96px;border:0;border-right:1px solid #e7e8eb;border-bottom:1px solid #e7e8eb;background:#fff;font-size:19px;font-weight:700;position:relative}.day.sun{color:#e53935}.day.sat{color:#1565d8}.day.muted{color:#c6c8cd}.todayNum{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#ff3948;color:white}.dot{width:6px;height:6px;border-radius:50%;background:#dca4ee;position:absolute;bottom:12px;left:50%;transform:translateX(-50%)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;padding-top:30px}.modal.show{display:flex}.sheet{background:white;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 8px}.sub{color:#7a808d;font-size:13px;margin-bottom:18px}.field{margin-bottom:14px}.field label{display:block;color:#6f7580;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #dedfe4;border-radius:13px;font-size:16px}.field textarea{min-height:120px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;margin-top:8px}.primary{background:#111827;color:#fff}.light{background:#f3f4f6}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{border:1px solid #e0e1e4;background:#fff;border-radius:16px;padding:22px 8px;font-weight:800;font-size:17px}.expenseRow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:center}.expenseList{margin-top:10px}.expenseItem{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.expenseItem button{border:0;background:#f3f4f6;border-radius:9px;padding:7px 10px}.goal input{flex:1;border:0;background:transparent;font-size:17px;outline:none}.goal button{border:0;background:transparent;font-size:20px;color:#999}.goalAdd{border:1px dashed #b9cec2;background:#fff;border-radius:12px;padding:10px;width:100%;margin-top:10px;font-weight:700;color:#128456}.mini{font-size:13px;color:#737986;margin-top:8px}@media(max-width:520px){.app{padding:18px 12px 50px}.head h1{font-size:30px}.month{font-size:38px}.day{min-height:78px;font-size:18px}}
</style>
</head>
<body>
<div class="app">
 <div class="head"><div><h1>LifeLog</h1><p>&#20170;&#26085;&#12418;&#19968;&#27497;&#12289;&#12424;&#12367;&#12420;&#12387;&#12383;&#12290;</p></div><button class="round" onclick="editGoals()">&#65291;</button></div>
 <section class="goalBox"><div class="goalTitle">&#9873; &#20170;&#12398;&#30446;&#27161;</div><div id="goals"></div><button class="goalAdd" onclick="addGoal()">&#65291; &#30446;&#27161;&#12434;&#36861;&#21152;</button></section>
 <div class="calHead"><div class="month" id="monthTitle">9&#26376;</div><div class="calBtns"><button class="calBtn" onclick="move(-1)">&#8249;</button><button class="calBtn" onclick="goToday()">&#9679;</button><button class="calBtn" onclick="move(1)">&#8250;</button></div></div>
 <div class="week"><div>&#26085;</div><div>&#26376;</div><div>&#28779;</div><div>&#27700;</div><div>&#26408;</div><div>&#37329;</div><div>&#22303;</div></div>
 <div class="grid" id="calendar">
  <button class="day muted sun" data-date="2026-08-30" onclick="dateTap(this)">30</button><button class="day muted" data-date="2026-08-31" onclick="dateTap(this)">31</button><button class="day" data-date="2026-09-01" onclick="dateTap(this)">1</button><button class="day" data-date="2026-09-02" onclick="dateTap(this)">2</button><button class="day" data-date="2026-09-03" onclick="dateTap(this)">3</button><button class="day" data-date="2026-09-04" onclick="dateTap(this)">4</button><button class="day sat" data-date="2026-09-05" onclick="dateTap(this)">5</button>
  <button class="day sun" data-date="2026-09-06" onclick="dateTap(this)">6</button><button class="day" data-date="2026-09-07" onclick="dateTap(this)">7</button><button class="day" data-date="2026-09-08" onclick="dateTap(this)">8</button><button class="day" data-date="2026-09-09" onclick="dateTap(this)"><span class="todayNum">9</span></button><button class="day" data-date="2026-09-10" onclick="dateTap(this)">10</button><button class="day" data-date="2026-09-11" onclick="dateTap(this)">11</button><button class="day sat" data-date="2026-09-12" onclick="dateTap(this)">12</button>
  <button class="day sun" data-date="2026-09-13" onclick="dateTap(this)">13</button><button class="day" data-date="2026-09-14" onclick="dateTap(this)">14</button><button class="day" data-date="2026-09-15" onclick="dateTap(this)">15</button><button class="day" data-date="2026-09-16" onclick="dateTap(this)">16</button><button class="day" data-date="2026-09-17" onclick="dateTap(this)">17</button><button class="day" data-date="2026-09-18" onclick="dateTap(this)">18</button><button class="day sat" data-date="2026-09-19" onclick="dateTap(this)">19</button>
  <button class="day sun" data-date="2026-09-20" onclick="dateTap(this)">20</button><button class="day" data-date="2026-09-21" onclick="dateTap(this)">21</button><button class="day" data-date="2026-09-22" onclick="dateTap(this)">22</button><button class="day" data-date="2026-09-23" onclick="dateTap(this)">23</button><button class="day" data-date="2026-09-24" onclick="dateTap(this)">24</button><button class="day" data-date="2026-09-25" onclick="dateTap(this)">25</button><button class="day sat" data-date="2026-09-26" onclick="dateTap(this)">26</button>
  <button class="day sun" data-date="2026-09-27" onclick="dateTap(this)">27</button><button class="day" data-date="2026-09-28" onclick="dateTap(this)">28</button><button class="day" data-date="2026-09-29" onclick="dateTap(this)">29</button><button class="day" data-date="2026-09-30" onclick="dateTap(this)">30</button><button class="day muted" data-date="2026-10-01" onclick="dateTap(this)">1</button><button class="day muted" data-date="2026-10-02" onclick="dateTap(this)">2</button><button class="day muted sat" data-date="2026-10-03" onclick="dateTap(this)">3</button>
 </div>
</div>
<div class="modal" id="choice" onclick="backdrop(event,'choice')"><div class="sheet"><h2 id="choiceDate">&#26085;&#20184;</h2><div class="sub">&#12371;&#12398;&#26085;&#12399;&#12393;&#12358;&#12377;&#12427;&#65311;</div><div class="choice"><button onclick="openEdit()">&#32232;&#38598;</button><button onclick="openPlan()">&#20104;&#23450;&#35352;&#20837;</button></div><button class="btn light" onclick="closeM('choice')">&#38281;&#12376;&#12427;</button></div></div>
<div class="modal" id="edit" onclick="backdrop(event,'edit')"><div class="sheet"><h2 id="editDate">&#20170;&#26085;&#12398;&#35352;&#37682;</h2><div class="two"><div class="field"><label>&#21220;&#21209;</label><select id="shift"><option value="">&#36984;&#25246;</option><option>&#26172;&#21220;</option><option>&#22812;&#21220;</option><option>&#20241;&#12415;</option></select></div><div class="field"><label>&#36864;&#31038;&#26178;&#38291;</label><input type="time" id="clock"></div></div><div class="field"><label>&#26085;&#35352; / &#20170;&#26085;&#12354;&#12387;&#12383;&#12371;&#12392;</label><textarea id="diary" placeholder="&#20170;&#26085;&#12354;&#12387;&#12383;&#12371;&#12392;&#12434;&#33258;&#30001;&#12395;&#26360;&#12367;"></textarea></div><div class="field"><label>&#20351;&#12387;&#12383;&#12362;&#37329;</label><div class="expenseRow"><input id="amount" type="number" inputmode="numeric" placeholder="&#37329;&#38989;"><input id="expenseNote" placeholder="&#20309;&#12395;&#20351;&#12387;&#12383;&#65311;"><button class="btn light" style="margin:0;padding:12px" onclick="addExpense()">&#36861;&#21152;</button></div><div class="expenseList" id="expenseList"></div></div><div class="mini" id="spentTotal">&#12371;&#12398;&#26085;&#12398;&#25903;&#20986; &#165;0</div><button class="btn primary" onclick="saveEdit()">&#20445;&#23384;</button><button class="btn light" onclick="closeM('edit')">&#38281;&#12376;&#12427;</button></div></div>
<div class="modal" id="plan" onclick="backdrop(event,'plan')"><div class="sheet"><h2 id="planDate">&#20104;&#23450;&#35352;&#20837;</h2><div class="field"><label>&#20309;&#26178;&#65311;</label><input type="time" id="planTime"></div><div class="field"><label>&#20104;&#23450;</label><input id="planText" placeholder="&#20363;&#65306;&#27503;&#21307;&#32773;&#12289;&#21451;&#36948;&#12392;&#12372;&#39151;"></div><button class="btn primary" onclick="savePlan()">&#20104;&#23450;&#12434;&#20445;&#23384;</button><button class="btn light" onclick="closeM('plan')">&#38281;&#12376;&#12427;</button></div></div>
<script>
const now=new Date();
const TODAY=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
let selected=TODAY; let shown=new Date(now.getFullYear(),now.getMonth(),1);
let db={};try{db=JSON.parse(localStorage.getItem('lifelog-simple')||'{}')||{}}catch(e){db={}}
let goals=[];try{goals=JSON.parse(localStorage.getItem('lifelog-goals')||'null')||['\u4eca\u67083\u4e07\u5186\u8caf\u91d1\u3059\u308b','\u90313\u56de\u7b4b\u30c8\u30ec','\u8cc7\u683c\u306e\u52c9\u5f37\u3092\u3059\u308b']}catch(e){goals=['\u4eca\u67083\u4e07\u5186\u8caf\u91d1\u3059\u308b','\u90313\u56de\u7b4b\u30c8\u30ec','\u8cc7\u683c\u306e\u52c9\u5f37\u3092\u3059\u308b']}
if(!localStorage.getItem('lifelog-v4-migrated')){
  goals=['\u4eca\u67083\u4e07\u5186\u8caf\u91d1\u3059\u308b','\u90313\u56de\u7b4b\u30c8\u30ec','\u8cc7\u683c\u306e\u52c9\u5f37\u3092\u3059\u308b'];
  try{localStorage.setItem('lifelog-goals',JSON.stringify(goals));localStorage.setItem('lifelog-v4-migrated','1')}catch(e){}
}
function store(){try{localStorage.setItem('lifelog-simple',JSON.stringify(db));localStorage.setItem('lifelog-goals',JSON.stringify(goals))}catch(e){}}
function fmt(ds){let [y,m,d]=ds.split('-');return `${y}\u5e74${Number(m)}\u6708${Number(d)}\u65e5`}
function show(id){document.getElementById(id).classList.add('show')}function closeM(id){document.getElementById(id).classList.remove('show')}function backdrop(e,id){if(e.target.id===id)closeM(id)}
function dateTap(el){selected=el.dataset.date;if(selected===TODAY)openEdit();else{document.getElementById('choiceDate').textContent=fmt(selected);show('choice')}}
function openEdit(){closeM('choice');let x=db[selected]||{};if(!x.expenses)x.expenses=x.spent?[{amount:Number(x.spent),note:'\u4ee5\u524d\u306e\u652f\u51fa'}]:[];db[selected]=x;document.getElementById('editDate').textContent=fmt(selected)+' \u306e\u8a18\u9332';document.getElementById('shift').value=x.shift||'';document.getElementById('clock').value=x.clock||'';document.getElementById('diary').value=x.diary||'';document.getElementById('amount').value='';document.getElementById('expenseNote').value='';renderExpenses();show('edit')}
function addExpense(){let a=Number(document.getElementById('amount').value||0),n=document.getElementById('expenseNote').value.trim();if(a<=0)return;let x=db[selected]||{};x.expenses=x.expenses||[];x.expenses.push({amount:a,note:n});x.spent=x.expenses.reduce((t,e)=>t+Number(e.amount||0),0);db[selected]=x;document.getElementById('amount').value='';document.getElementById('expenseNote').value='';store();renderExpenses()}
function removeExpense(i){let x=db[selected]||{};x.expenses=x.expenses||[];x.expenses.splice(i,1);x.spent=x.expenses.reduce((t,e)=>t+Number(e.amount||0),0);db[selected]=x;store();renderExpenses()}
function renderExpenses(){let x=db[selected]||{},es=x.expenses||[];document.getElementById('expenseList').innerHTML=es.map((e,i)=>'<div class="expenseItem"><span>'+(e.note||'\u652f\u51fa')+'</span><b>\u00a5'+Number(e.amount||0).toLocaleString()+'</b><button onclick="removeExpense('+i+')">\u524a\u9664</button></div>').join('');document.getElementById('spentTotal').textContent='\u3053\u306e\u65e5\u306e\u652f\u51fa \u00a5'+es.reduce((t,e)=>t+Number(e.amount||0),0).toLocaleString()}
function saveEdit(){let x=db[selected]||{};x.shift=document.getElementById('shift').value;x.clock=document.getElementById('clock').value;x.diary=document.getElementById('diary').value;db[selected]=x;store();render();closeM('edit')}
function openPlan(){closeM('choice');let x=db[selected]||{};document.getElementById('planDate').textContent=fmt(selected)+' \u306e\u4e88\u5b9a';document.getElementById('planTime').value=x.planTime||'';document.getElementById('planText').value=x.planText||'';show('plan')}
function savePlan(){let x=db[selected]||{};x.planTime=document.getElementById('planTime').value;x.planText=document.getElementById('planText').value;db[selected]=x;store();render();closeM('plan')}
function render(){let y=shown.getFullYear(),m=shown.getMonth();document.getElementById('monthTitle').textContent=(m+1)+'\u6708';let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),html='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let cls='day '+(d.getDay()==0?'sun ':'')+(d.getDay()==6?'sat ':'')+(d.getMonth()!=m?'muted ':'');let n=ds===TODAY?'<span class="todayNum">'+d.getDate()+'</span>':d.getDate();let dot=db[ds]&&((db[ds].diary)||(db[ds].planText)||(db[ds].spent))?'<span class="dot"></span>':'';html+='<button class="'+cls+'" data-date="'+ds+'" onclick="dateTap(this)">'+n+dot+'</button>'}document.getElementById('calendar').innerHTML=html}
function move(n){shown=new Date(shown.getFullYear(),shown.getMonth()+n,1);render()}function goToday(){shown=new Date(now.getFullYear(),now.getMonth(),1);render()}
function renderGoals(){document.getElementById('goals').innerHTML=goals.map((g,i)=>'<div class="goal"><span class="check"></span><input value="'+String(g).replace(/"/g,'&quot;')+'" onchange="changeGoal('+i+',this.value)"><button onclick="deleteGoal('+i+')">\u00d7</button></div>').join('')}
function changeGoal(i,v){goals[i]=v;store()}
function addGoal(){goals.push('\u65b0\u3057\u3044\u76ee\u6a19');store();renderGoals()}
function deleteGoal(i){goals.splice(i,1);store();renderGoals()}
function editGoals(){addGoal()}
renderGoals();render();
</script>
</body></html>
