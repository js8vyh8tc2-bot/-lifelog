<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LifeLog</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#0d1321;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:22px 16px 70px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.head h1{font-size:34px;margin:0;letter-spacing:-1px}.head p{margin:4px 0 0;color:#9aa0ad}.round{border:0;background:#f3f4f6;border-radius:50%;width:48px;height:48px;font-size:26px}.goalBox{background:#f4faf7;border:1px solid #e2f0e8;border-radius:22px;padding:16px 18px;margin-bottom:34px}.goalTitle{font-weight:800;color:#128456;font-size:18px;margin-bottom:8px}.goal{padding:13px 0;border-bottom:1px solid #dfe9e3;font-size:17px;display:flex;gap:10px;align-items:center}.goal:last-child{border-bottom:0}.check{width:24px;height:24px;border:2px solid #a7ada9;border-radius:7px;background:#fff}.calHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month{font-size:42px;font-weight:900;letter-spacing:-2px}.calBtns{display:flex;gap:10px}.calBtn{border:0;background:#f3f4f6;border-radius:50%;width:48px;height:48px;font-size:22px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;font-weight:700;padding:12px 0;border-bottom:1px solid #e7e8eb}.week div:first-child{color:#e53935}.week div:last-child{color:#1565d8}.grid{border-left:1px solid #e7e8eb;border-top:1px solid #e7e8eb;border-radius:18px;overflow:hidden}.day{min-height:96px;border:0;border-right:1px solid #e7e8eb;border-bottom:1px solid #e7e8eb;background:#fff;font-size:19px;font-weight:700;position:relative}.day.sun{color:#e53935}.day.sat{color:#1565d8}.day.muted{color:#c6c8cd}.todayNum{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#ff3948;color:white}.dot{width:6px;height:6px;border-radius:50%;background:#dca4ee;position:absolute;bottom:12px;left:50%;transform:translateX(-50%)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;padding-top:30px}.modal.show{display:flex}.sheet{background:white;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 8px}.sub{color:#7a808d;font-size:13px;margin-bottom:18px}.field{margin-bottom:14px}.field label{display:block;color:#6f7580;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #dedfe4;border-radius:13px;font-size:16px}.field textarea{min-height:120px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;margin-top:8px}.primary{background:#111827;color:#fff}.light{background:#f3f4f6}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{border:1px solid #e0e1e4;background:#fff;border-radius:16px;padding:22px 8px;font-weight:800;font-size:17px}.expenseRow{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}.mini{font-size:13px;color:#737986;margin-top:8px}@media(max-width:520px){.app{padding:18px 12px 50px}.head h1{font-size:30px}.month{font-size:38px}.day{min-height:78px;font-size:18px}}
</style>
</head>
<body>
<div class="app">
 <div class="head"><div><h1>LifeLog</h1><p>今日も一歩、よくやった。</p></div><button class="round" onclick="editGoals()">＋</button></div>
 <section class="goalBox"><div class="goalTitle">⚑ 今の目標</div><div id="goals"><div class="goal"><span class="check"></span>今月3万円貯金する</div><div class="goal"><span class="check"></span>週3回筋トレ</div><div class="goal"><span class="check"></span>資格の勉強をする</div></div></section>
 <div class="calHead"><div class="month" id="monthTitle">9月</div><div class="calBtns"><button class="calBtn" onclick="move(-1)">‹</button><button class="calBtn" onclick="goToday()">●</button><button class="calBtn" onclick="move(1)">›</button></div></div>
 <div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
 <div class="grid" id="calendar">
  <button class="day muted sun" data-date="2026-08-30" onclick="dateTap(this)">30</button><button class="day muted" data-date="2026-08-31" onclick="dateTap(this)">31</button><button class="day" data-date="2026-09-01" onclick="dateTap(this)">1</button><button class="day" data-date="2026-09-02" onclick="dateTap(this)">2</button><button class="day" data-date="2026-09-03" onclick="dateTap(this)">3</button><button class="day" data-date="2026-09-04" onclick="dateTap(this)">4</button><button class="day sat" data-date="2026-09-05" onclick="dateTap(this)">5</button>
  <button class="day sun" data-date="2026-09-06" onclick="dateTap(this)">6</button><button class="day" data-date="2026-09-07" onclick="dateTap(this)">7</button><button class="day" data-date="2026-09-08" onclick="dateTap(this)">8</button><button class="day" data-date="2026-09-09" onclick="dateTap(this)"><span class="todayNum">9</span></button><button class="day" data-date="2026-09-10" onclick="dateTap(this)">10</button><button class="day" data-date="2026-09-11" onclick="dateTap(this)">11</button><button class="day sat" data-date="2026-09-12" onclick="dateTap(this)">12</button>
  <button class="day sun" data-date="2026-09-13" onclick="dateTap(this)">13</button><button class="day" data-date="2026-09-14" onclick="dateTap(this)">14</button><button class="day" data-date="2026-09-15" onclick="dateTap(this)">15</button><button class="day" data-date="2026-09-16" onclick="dateTap(this)">16</button><button class="day" data-date="2026-09-17" onclick="dateTap(this)">17</button><button class="day" data-date="2026-09-18" onclick="dateTap(this)">18</button><button class="day sat" data-date="2026-09-19" onclick="dateTap(this)">19</button>
  <button class="day sun" data-date="2026-09-20" onclick="dateTap(this)">20</button><button class="day" data-date="2026-09-21" onclick="dateTap(this)">21</button><button class="day" data-date="2026-09-22" onclick="dateTap(this)">22</button><button class="day" data-date="2026-09-23" onclick="dateTap(this)">23</button><button class="day" data-date="2026-09-24" onclick="dateTap(this)">24</button><button class="day" data-date="2026-09-25" onclick="dateTap(this)">25</button><button class="day sat" data-date="2026-09-26" onclick="dateTap(this)">26</button>
  <button class="day sun" data-date="2026-09-27" onclick="dateTap(this)">27</button><button class="day" data-date="2026-09-28" onclick="dateTap(this)">28</button><button class="day" data-date="2026-09-29" onclick="dateTap(this)">29</button><button class="day" data-date="2026-09-30" onclick="dateTap(this)">30</button><button class="day muted" data-date="2026-10-01" onclick="dateTap(this)">1</button><button class="day muted" data-date="2026-10-02" onclick="dateTap(this)">2</button><button class="day muted sat" data-date="2026-10-03" onclick="dateTap(this)">3</button>
 </div>
</div>
<div class="modal" id="choice" onclick="backdrop(event,'choice')"><div class="sheet"><h2 id="choiceDate">日付</h2><div class="sub">この日はどうする？</div><div class="choice"><button onclick="openEdit()">編集</button><button onclick="openPlan()">予定記入</button></div><button class="btn light" onclick="closeM('choice')">閉じる</button></div></div>
<div class="modal" id="edit" onclick="backdrop(event,'edit')"><div class="sheet"><h2 id="editDate">今日の記録</h2><div class="two"><div class="field"><label>勤務</label><select id="shift"><option value="">選択</option><option>昼勤</option><option>夜勤</option><option>休み</option></select></div><div class="field"><label>退社時間</label><input type="time" id="clock"></div></div><div class="field"><label>日記 / 今日あったこと</label><textarea id="diary" placeholder="今日あったことを自由に書く"></textarea></div><div class="field"><label>使ったお金</label><div class="expenseRow"><input id="amount" type="number" inputmode="numeric" placeholder="金額"><input id="expenseNote" placeholder="何に使った？"></div></div><div class="mini" id="spentTotal">この日の支出 ¥0</div><button class="btn primary" onclick="saveEdit()">保存</button><button class="btn light" onclick="closeM('edit')">閉じる</button></div></div>
<div class="modal" id="plan" onclick="backdrop(event,'plan')"><div class="sheet"><h2 id="planDate">予定記入</h2><div class="field"><label>何時？</label><input type="time" id="planTime"></div><div class="field"><label>予定</label><input id="planText" placeholder="例：歯医者、友達とご飯"></div><button class="btn primary" onclick="savePlan()">予定を保存</button><button class="btn light" onclick="closeM('plan')">閉じる</button></div></div>
<script>
const TODAY='2026-09-09'; let selected=TODAY; let shown=new Date(2026,8,1);
let db={};try{db=JSON.parse(localStorage.getItem('lifelog-simple')||'{}')||{}}catch(e){db={}}
function store(){try{localStorage.setItem('lifelog-simple',JSON.stringify(db))}catch(e){}}
function fmt(ds){let [y,m,d]=ds.split('-');return `${y}年${Number(m)}月${Number(d)}日`}
function show(id){document.getElementById(id).classList.add('show')}function closeM(id){document.getElementById(id).classList.remove('show')}function backdrop(e,id){if(e.target.id===id)closeM(id)}
function dateTap(el){selected=el.dataset.date;if(selected===TODAY)openEdit();else{document.getElementById('choiceDate').textContent=fmt(selected);show('choice')}}
function openEdit(){closeM('choice');let x=db[selected]||{};document.getElementById('editDate').textContent=fmt(selected)+' の記録';document.getElementById('shift').value=x.shift||'';document.getElementById('clock').value=x.clock||'';document.getElementById('diary').value=x.diary||'';document.getElementById('amount').value='';document.getElementById('expenseNote').value='';document.getElementById('spentTotal').textContent='この日の支出 ¥'+Number(x.spent||0).toLocaleString();show('edit')}
function saveEdit(){let x=db[selected]||{};x.shift=document.getElementById('shift').value;x.clock=document.getElementById('clock').value;x.diary=document.getElementById('diary').value;let a=Number(document.getElementById('amount').value||0);if(a>0)x.spent=Number(x.spent||0)+a;db[selected]=x;store();render();closeM('edit')}
function openPlan(){closeM('choice');let x=db[selected]||{};document.getElementById('planDate').textContent=fmt(selected)+' の予定';document.getElementById('planTime').value=x.planTime||'';document.getElementById('planText').value=x.planText||'';show('plan')}
function savePlan(){let x=db[selected]||{};x.planTime=document.getElementById('planTime').value;x.planText=document.getElementById('planText').value;db[selected]=x;store();render();closeM('plan')}
function render(){let y=shown.getFullYear(),m=shown.getMonth();document.getElementById('monthTitle').textContent=(m+1)+'月';let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),html='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let cls='day '+(d.getDay()==0?'sun ':'')+(d.getDay()==6?'sat ':'')+(d.getMonth()!=m?'muted ':'');let n=ds===TODAY?'<span class="todayNum">'+d.getDate()+'</span>':d.getDate();let dot=db[ds]&&((db[ds].diary)||(db[ds].planText)||(db[ds].spent))?'<span class="dot"></span>':'';html+='<button class="'+cls+'" data-date="'+ds+'" onclick="dateTap(this)">'+n+dot+'</button>'}document.getElementById('calendar').innerHTML=html}
function move(n){shown=new Date(shown.getFullYear(),shown.getMonth()+n,1);render()}function goToday(){shown=new Date(2026,8,1);render()}
function editGoals(){alert('目標の編集機能は次に追加できるよ。まずはカレンダー操作を確認してね。')}
render();
</script>
</body></html>
